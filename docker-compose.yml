# Runs the Guidy backend + a self-hosted OSRM instance together.
#
# --- ONE-TIME SETUP (do this before your first `docker compose up`) ------
# OSRM needs its routing graph pre-built from an OSM extract; that's a
# separate one-time processing step, not something docker-compose can do
# as part of starting the service. Run these once, from this directory,
# before starting the stack (see osrm_client.py for more detail):
#
#   mkdir -p osrm_data && cd osrm_data
#   curl -O https://download.geofabrik.de/africa/egypt-latest.osm.pbf
#   docker run -t -v "${PWD}:/data" ghcr.io/project-osrm/osrm-backend \
#     osrm-extract -p /opt/foot.lua /data/egypt-latest.osm.pbf
#   docker run -t -v "${PWD}:/data" ghcr.io/project-osrm/osrm-backend \
#     osrm-partition /data/egypt-latest.osrm
#   docker run -t -v "${PWD}:/data" ghcr.io/project-osrm/osrm-backend \
#     osrm-customize /data/egypt-latest.osrm
#   cd ..
#
# After that, `docker compose up` starts both services together. Re-run
# the steps above only when you need to refresh the underlying map data.
# ---------------------------------------------------------------------------

services:
  # Caddy is the only service with published ports. It terminates TLS
  # (automatic Let's Encrypt cert + renewal for DOMAIN, no manual cert
  # steps needed) and reverse-proxies to the backend over the internal
  # docker network. See DEPLOYMENT.md for the one-time DNS/DOMAIN setup.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    # No "ports:" here on purpose -- only Caddy is reachable from outside
    # the server. The backend is still reachable by name ("backend:8000")
    # from other containers on this compose network, which is all Caddy
    # needs. If you need direct host access for local debugging, run
    # `docker compose port backend 8000` or temporarily add back
    # `ports: ["127.0.0.1:8000:8000"]` (bind to localhost only, never 0.0.0.0).
    environment:
      - GTFS_PATH=/data/gtfs
      - USE_OSRM=true
      - OSRM_BASE_URL=http://osrm:5000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./gtfs_data:/data/gtfs:ro
    depends_on:
      - osrm
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/egypt-latest.osrm
    # No "ports:" here either -- OSRM has no auth of its own, so it must
    # never be reachable from outside the server. The backend reaches it
    # internally via OSRM_BASE_URL=http://osrm:5000 above.
    volumes:
      - ./osrm_data:/data:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
